error_page 404 /gui/index.php?err=404;
error_page 403 /gui/index.php?err=403;

location / {
	try_files $uri $uri/ @nofile;
}

# Magic Systech/MediaYou favorites endpoint. Some firmware uses .asp and
# newer variants use .php; both speak the same compact line protocol.
location ~ "^/embedded/GetMyMediaU_sn4\.(asp|php)$" {
	rewrite ^ /mediayou.php?action=favorites last;
}

location ~ ^/(data|classes){
	deny all;
	return 403;
}

# internal proxy to support ssl streams
location ~* "^/proxy/([^/]*)/?.*$" {
	internal;

	proxy_pass $args;
	proxy_set_header Host $1;
	proxy_ssl_server_name on;
	proxy_ssl_name $1;
	proxy_buffering off;
	proxy_connect_timeout 5s;
	proxy_redirect https://$1/ /stream.php?url=https://$1/;
	proxy_redirect http://$1/ /stream.php?url=http://$1/;
}

# same as /proxy/, for stations whose ICY metadata the radio cannot render
#	(e.g. CJK titles on firmware without those glyphs, or a station that emits
#	malformed UTF-8). Clearing Icy-MetaData stops the upstream interleaving
#	metadata at all, so the radio falls back to the name from the directory.
location ~* "^/proxy-nometa/([^/]*)/?.*$" {
	internal;

	proxy_pass $args;
	proxy_set_header Host $1;
	proxy_set_header Icy-MetaData "";
	proxy_hide_header icy-metaint;
	proxy_ssl_server_name on;
	proxy_ssl_name $1;
	proxy_buffering off;
	proxy_connect_timeout 5s;
	proxy_redirect https://$1/ /stream.php?url=https://$1/;
	proxy_redirect http://$1/ /stream.php?url=http://$1/;
}

location @nofile {
	rewrite ^(.*)$ /index.php?uri=$1 last;
}

# add ssl for newer radios, the cert is self-signed and will be created by startup.sh
listen 443 ssl; 
ssl_certificate /php-code/data/ssl_crt.pem; 
ssl_certificate_key /php-code/data/ssl_key.pem; 
